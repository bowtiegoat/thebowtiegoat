name: Update Content Feeds

# Pulls the latest posts from the BowtieGOAT Substack RSS feed and the
# latest long-form video from the BowtieGOAT YouTube channel, committing
# any changes to js/blog-posts.json and js/latest-video.json -- the blog
# page and homepage "Latest Video" card render from these.
#
# TO CHANGE HOW OFTEN THIS RUNS: edit the cron schedule below.
#   Cron format is: minute hour day month day-of-week (all times UTC).
#   Current schedule: every day at 13:00 UTC (9:00am ET / 6:00am PT).
#   Examples:
#     '0 13 * * *'     every day at 13:00 UTC
#     '0 13 * * 1'     every Monday at 13:00 UTC
#     '0 */6 * * *'    every 6 hours
#
# You can also run it manually anytime: go to the "Actions" tab on GitHub,
# click "Update Content Feeds" in the left sidebar, then "Run workflow".

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Each feed runs on its own, so if one site refuses the request the
      # other still updates. A failure is reported at the end of the run.
      - name: Fetch latest Substack posts
        id: blog
        continue-on-error: true
        run: python3 scripts/fetch_blog_posts.py

      - name: Fetch latest YouTube video
        id: video
        continue-on-error: true
        run: python3 scripts/fetch_latest_video.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/blog-posts.json js/latest-video.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update content feeds from Substack and YouTube"
          git pull --rebase
          git push

      - name: Report feed problems
        if: steps.blog.outcome == 'failure' || steps.video.outcome == 'failure'
        run: |
          if [ "${{ steps.blog.outcome }}" = "failure" ]; then
            echo "::error::The Substack feed could not be loaded, so the blog was not updated. Expand 'Fetch latest Substack posts' above to see why."
          fi
          if [ "${{ steps.video.outcome }}" = "failure" ]; then
            echo "::error::The YouTube feed could not be loaded, so the Latest Video card was not updated. Expand 'Fetch latest YouTube video' above to see why."
          fi
          exit 1
